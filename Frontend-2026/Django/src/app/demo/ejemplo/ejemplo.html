<p-card class="ejemplo-alcance">
  <section class="space-y-6 p-2 sm:p-4">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wide text-teal-700">
          Vista de ejemplo · sin conexión a la API
        </p>
        <h2 class="mt-1 text-2xl font-bold text-slate-950">
          Orden de servicio
        </h2>
        <p class="mt-1 text-slate-600">
          {{ orden().number }} · {{ orden().clientName }}
        </p>
      </div>
      <p-tag [value]="estadoTexto()" [severity]="estadoSeverity()" />
    </div>

    <div class="grid gap-4 rounded-xl bg-slate-50 p-4 sm:grid-cols-2">
      <div>
        <p class="text-sm text-slate-500">Equipo</p>
        <p class="mt-1 font-medium text-slate-900">{{ orden().equipmentName }}</p>
      </div>
      <div>
        <p class="text-sm text-slate-500">Valor estimado (demostración)</p>
        <p class="mt-1 text-2xl font-semibold text-slate-950">
          {{ totalEstimado() | currency: 'COP' : 'symbol-narrow' : '1.0-0' : 'es-CO' }}
        </p>
      </div>
    </div>

    <label class="block max-w-xl">
      <span class="mb-2 block text-sm font-medium text-slate-700">
        Descripción del servicio
      </span>
      <input
        #descripcionServicio
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-100"
        type="text"
        [value]="descripcion()"
        (input)="actualizarDescripcion(descripcionServicio.value)"
      />
      <span class="mt-2 block text-sm text-slate-500">
        Vista previa: {{ descripcion() }}
      </span>
    </label>

    <div class="flex flex-wrap gap-3 border-t border-slate-200 pt-5">
      <p-button
        label="Aumentar estimado $1.000"
        icon="pi pi-plus"
        (onClick)="incrementarEstimado()"
      />
      <p-button
        label="Cambiar estado"
        severity="secondary"
        (onClick)="cambiarEstado()"
      />
      <p-button
        label="Reiniciar ejemplo"
        severity="contrast"
        [outlined]="true"
        (onClick)="reiniciar()"
      />
    </div>
  </section>
</p-card>
